name: GLUBALL deterministic checks

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Runtime
        run: node --version
      - name: Geometry contract smoke suite
        run: node tests/smoke.mjs
      - name: Phase 2 deterministic/evidence suite
        run: node tests/phase2.mjs
      - name: AI agent contract validation
        run: node tests/agent-contract.mjs
      - name: Self-hosted CUDA workflow boundary
        run: |
          python3 -m py_compile scripts/verify_cuda_runtime_v31_physical_preflight.py
          python3 -m py_compile scripts/bind_cuda_runtime_v31_physical_preflight.py
          python3 -m py_compile scripts/bind_cuda_runtime_v31_frozen_build_inputs.py
          python3 -m py_compile scripts/finalize_cuda_runtime_v31_architecture.py
          python3 -m py_compile scripts/compare_cuda_runtime_v31_architecture_results.py
          node tests/self-hosted-actions.mjs
          node tests/phase5c-multigpu-actions.mjs
          node tests/cuda-runtime-v3.mjs
          node tests/cuda-runtime-v3-workflow.mjs
          node tests/cuda-runtime-v31.mjs
          node tests/cuda-runtime-v31-workflow.mjs
          node tests/cuda-runtime-v31-architecture-ladder.mjs
          node tests/cuda-runtime-v31-physical-preflight.mjs
          node tests/cuda-runtime-v31-receipt-boundary-hardening.mjs
      - name: v1.0.0 release preflight
        run: node tests/release-preflight.mjs
