name: GLUBALL Runtime V3.1 weak-GPU efficiency

on:
  workflow_dispatch:
    inputs:
      expected_model_fragment:
        description: "Expected GPU model substring, e.g. GTX 1080 Ti or GTX 1660 Ti"
        required: true
        default: "GTX 1080 Ti"
        type: string
      u_segments:
        description: "V2/V3/V3.1 comparison and tuning U segments"
        required: true
        default: "16384"
        type: string
      v_segments:
        description: "V2/V3/V3.1 comparison and tuning V segments"
        required: true
        default: "128"
        type: string
      warmup_iterations:
        description: "Warmup iterations per process"
        required: true
        default: "20"
        type: string
      measured_iterations:
        description: "Measured iterations per process"
        required: true
        default: "1000"
        type: string
      trials:
        description: "Independent process trials per tuner candidate"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: gluball-runtime-v31-efficiency
  cancel-in-progress: false

jobs:
  physical-efficiency:
    runs-on: [self-hosted, linux, x64, gluball-vast-v31-efficiency]
    timeout-minutes: 180
    env:
      EVIDENCE_ROOT: physical-evidence/runtime-v31-efficiency

    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Expose rented-host toolchains
        run: |
          set -eu
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          printf '%s\n' '/usr/local/cuda/bin' >> "$GITHUB_PATH"

      - name: Validate dispatch inputs
        env:
          MODEL_FRAGMENT: ${{ inputs.expected_model_fragment }}
          U_INPUT: ${{ inputs.u_segments }}
          V_INPUT: ${{ inputs.v_segments }}
          WARMUP_INPUT: ${{ inputs.warmup_iterations }}
          ITERATIONS_INPUT: ${{ inputs.measured_iterations }}
          TRIALS_INPUT: ${{ inputs.trials }}
        run: |
          python3 - <<'PY'
          import os
          def integer(name, lo, hi):
              raw = os.environ[name]
              if not raw.isdecimal(): raise SystemExit(f"{name} must be decimal")
              value = int(raw)
              if not lo <= value <= hi: raise SystemExit(f"{name} must be in [{lo},{hi}]")
          if not os.environ["MODEL_FRAGMENT"].strip(): raise SystemExit("expected_model_fragment must not be empty")
          integer("U_INPUT", 12, 1_000_000)
          integer("V_INPUT", 6, 65_536)
          integer("WARMUP_INPUT", 0, 1_000)
          integer("ITERATIONS_INPUT", 2, 10_000)
          integer("TRIALS_INPUT", 1, 20)
          PY

      - name: Record and validate physical host provenance
        env:
          MODEL_FRAGMENT: ${{ inputs.expected_model_fragment }}
        run: |
          set -eu
          root="$EVIDENCE_ROOT"
          mkdir -p "$root"
          git rev-parse HEAD | tee "$root/SOURCE_COMMIT.txt"
          uname -a | tee "$root/HOST_UNAME.txt"
          uname -m | tee "$root/HOST_ARCH.txt"
          cat /etc/os-release > "$root/OS_RELEASE.txt"
          test "$(uname -m)" = x86_64
          nvidia-smi --query-gpu=index,name,driver_version,compute_cap,memory.total --format=csv | tee "$root/NVIDIA_INVENTORY.csv"
          model=$(nvidia-smi --query-gpu=name --format=csv,noheader | sed -n '1p')
          capability=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | sed -n '1p')
          case "$model" in *"$MODEL_FRAGMENT"*) ;; *) printf 'unexpected GPU model: %s\n' "$model" >&2; exit 2 ;; esac
          arch_digits=$(printf '%s' "$capability" | tr -d '.')
          expected_compute="compute_${arch_digits}"
          expected_sm="sm_${arch_digits}"
          printf '%s\n' "$model" > "$root/SELECTED_GPU_MODEL.txt"
          printf '%s\n' "$capability" > "$root/EXPECTED_COMPUTE_CAPABILITY.txt"
          printf '%s\n' "$expected_sm" > "$root/EXPECTED_SM.txt"
          printf '0\n' > "$root/SELECTED_DEVICES.txt"
          nvcc --version | tee "$root/NVCC.txt"
          nvcc --list-gpu-arch | tee "$root/NVCC_GPU_ARCHS.txt"
          nvcc --list-gpu-code | tee "$root/NVCC_GPU_CODE.txt"
          grep -Fxq "$expected_compute" "$root/NVCC_GPU_ARCHS.txt"
          grep -Fxq "$expected_sm" "$root/NVCC_GPU_CODE.txt"
          rustc --version | tee "$root/RUSTC.txt"
          cargo --version | tee "$root/CARGO.txt"
          cmake --version | tee "$root/CMAKE.txt"
          compute-sanitizer --version | tee "$root/COMPUTE_SANITIZER.txt"
          touch "$root/HOST_VALIDATION.ok"

      - name: V1 bounded correctness anchor
        env:
          MODE: evidence
          U: "512"
          V: "32"
          REPEATS: "1"
          RUNS: "3"
          DEVICES: "0"
          RUST_WORKERS: "8"
          LOGICAL_DEVICE_SLOTS: "1"
          GLUBALL_CUDA_ARCHITECTURES: native
          CAMPAIGN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-runtime-v31-v1
          ARTIFACT_DIR: ${{ github.workspace }}/physical-evidence/runtime-v31-efficiency/v1-acceptance
        run: sh scripts/run_vast_campaign.sh

      - name: Verify V1 correctness, repeatability, and sanitizer archive
        run: |
          set -eu
          campaign="$EVIDENCE_ROOT/v1-acceptance"
          python3 - "$campaign" <<'PY'
          import hashlib
          import json
          import math
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          expected_runs = 3
          expected_ordinals = set(range(1, expected_runs + 1))
          issues = []

          def numbered(pattern, regex, label):
              found = {}
              for path in root.glob(pattern):
                  match = re.fullmatch(regex, path.name)
                  if not match:
                      continue
                  ordinal = int(match.group(1))
                  if ordinal in found:
                      issues.append(
                          f"duplicate {label} ordinal {ordinal}: {found[ordinal].name}, {path.name}"
                      )
                      continue
                  found[ordinal] = path
              actual_ordinals = set(found)
              if actual_ordinals != expected_ordinals:
                  issues.append(
                      f"{label} ordinals must equal {sorted(expected_ordinals)}, "
                      f"found {sorted(actual_ordinals)}"
                  )
              return found

          records = numbered(
              "cuda-acceptance-*.json",
              r"cuda-acceptance-(\d+)\.json",
              "V1 acceptance record",
          )
          outputs = numbered(
              "cuda-output-*.f32le",
              r"cuda-output-(\d+)\.f32le",
              "V1 output field",
          )
          sidecars = numbered(
              "cuda-run-*.json",
              r"cuda-run-(\d+)\.json",
              "V1 CUDA sidecar",
          )

          if len(records) != expected_runs:
              issues.append(f"expected {expected_runs} V1 acceptance records, found {len(records)}")
          if len(outputs) != expected_runs:
              issues.append(f"expected {expected_runs} V1 output fields, found {len(outputs)}")
          if len(sidecars) != expected_runs:
              issues.append(f"expected {expected_runs} V1 CUDA sidecars, found {len(sidecars)}")

          def is_int(value, minimum=None):
              return (
                  isinstance(value, int)
                  and not isinstance(value, bool)
                  and (minimum is None or value >= minimum)
              )

          def is_positive_int(value):
              return is_int(value, 1)

          def is_nonnegative_number(value):
              return (
                  isinstance(value, (int, float))
                  and not isinstance(value, bool)
                  and math.isfinite(float(value))
                  and float(value) >= 0.0
              )

          def is_fnv1a64(value):
              return isinstance(value, str) and re.fullmatch(r"[0-9a-fA-F]{16}", value) is not None

          stable_field_validators = {
              "total_points": is_positive_int,
              "checked_points": is_positive_int,
              "max_component_residual": is_nonnegative_number,
              "max_euclidean_residual": is_nonnegative_number,
              "max_reported_tube_radius_error": is_nonnegative_number,
              "worst_linear_index": lambda value: is_int(value, 0),
              "evidence_artifact_fnv1a64": is_fnv1a64,
          }

          payloads = {}
          for ordinal in sorted(expected_ordinals):
              path = records.get(ordinal)
              if path is None:
                  continue
              try:
                  payload = json.loads(path.read_text())
              except Exception as exc:
                  issues.append(f"cannot parse {path.name}: {exc}")
                  continue
              payloads[ordinal] = payload

              for field, validator in stable_field_validators.items():
                  if field not in payload:
                      issues.append(f"{path.name}: missing required stable field {field}")
                  elif not validator(payload[field]):
                      issues.append(f"{path.name}: invalid type/value for stable field {field}")

              discovered_output = outputs.get(ordinal)
              discovered_sidecar = sidecars.get(ordinal)
              evidence_output_path = payload.get("evidence_output_path")
              cuda_sidecar_path = payload.get("cuda_sidecar_path")
              checks = {
                  "status": payload.get("status") == "PASS",
                  "repeat_run": is_int(payload.get("repeat_run"), 1) and payload.get("repeat_run") == ordinal,
                  "complete_output_readback": payload.get("complete_output_readback") is True,
                  "reference_residual_checked": payload.get("reference_residual_checked") is True,
                  "conformance_acceptance": payload.get("conformance_acceptance") is True,
                  "geometry_receipt_authority": payload.get("geometry_receipt_authority") is False,
                  "universal_speedup_claim": payload.get("universal_speedup_claim") is False,
                  "checked_points_equal_total": (
                      is_positive_int(payload.get("checked_points"))
                      and is_positive_int(payload.get("total_points"))
                      and payload.get("checked_points") == payload.get("total_points")
                  ),
                  "nonfinite_records_zero": is_int(payload.get("nonfinite_records"), 0) and payload.get("nonfinite_records") == 0,
                  "matching_output_path": (
                      discovered_output is not None
                      and isinstance(evidence_output_path, str)
                      and Path(evidence_output_path).name == discovered_output.name
                  ),
                  "matching_sidecar_path": (
                      discovered_sidecar is not None
                      and isinstance(cuda_sidecar_path, str)
                      and Path(cuda_sidecar_path).name == discovered_sidecar.name
                  ),
              }
              for name, passed in checks.items():
                  if not passed:
                      issues.append(f"{path.name}: failed {name}")

          stable_values = {}
          if set(payloads) == expected_ordinals:
              for field, validator in stable_field_validators.items():
                  values = [payloads[ordinal].get(field) for ordinal in sorted(expected_ordinals)]
                  if not all(validator(value) for value in values):
                      continue
                  stable_values[field] = values[0]
                  if any(value != values[0] for value in values[1:]):
                      issues.append(f"V1 acceptance field not repeatable: {field}")

          output_sha256_by_run = {
              str(ordinal): hashlib.sha256(outputs[ordinal].read_bytes()).hexdigest()
              for ordinal in sorted(expected_ordinals)
              if ordinal in outputs
          }
          output_sha256 = [
              output_sha256_by_run[str(ordinal)]
              for ordinal in sorted(expected_ordinals)
              if str(ordinal) in output_sha256_by_run
          ]
          output_repeatable = (
              set(outputs) == expected_ordinals
              and len(output_sha256) == expected_runs
              and len(set(output_sha256)) == 1
          )
          if set(outputs) == expected_ordinals and not output_repeatable:
              issues.append("V1 complete output fields are not byte-identical across repeats")

          def find_clean_summary(expected, candidates):
              for path in candidates:
                  if path.is_file() and path.stat().st_size > 0 and expected in path.read_text(errors="replace"):
                      return path
              return None

          memcheck_source = find_clean_summary(
              "ERROR SUMMARY: 0 errors",
              [root / "memcheck.txt", root / "memcheck-run.json"],
          )
          racecheck_source = find_clean_summary(
              "RACECHECK SUMMARY: 0 hazards displayed (0 errors, 0 warnings)",
              [root / "racecheck.txt", root / "racecheck-run.json"],
          )
          if memcheck_source is None:
              issues.append("clean V1 memcheck summary not found in either archival location")
          if racecheck_source is None:
              issues.append("clean V1 racecheck summary not found in either archival location")

          summary = {
              "schema": "gluball-runtime-v31-v1-validation/1",
              "status": "PASS" if not issues else "FAIL",
              "expected_runs": expected_runs,
              "expected_ordinals": sorted(expected_ordinals),
              "acceptance_record_ordinals": sorted(records),
              "cuda_sidecar_ordinals": sorted(sidecars),
              "output_ordinals": sorted(outputs),
              "acceptance_record_files": [records[ordinal].name for ordinal in sorted(records)],
              "cuda_sidecar_files": [sidecars[ordinal].name for ordinal in sorted(sidecars)],
              "output_files": [outputs[ordinal].name for ordinal in sorted(outputs)],
              "acceptance_record_count": len(records),
              "cuda_sidecar_count": len(sidecars),
              "output_file_count": len(outputs),
              "output_sha256": output_sha256,
              "output_sha256_by_run": output_sha256_by_run,
              "output_repeatable_byte_identical": output_repeatable,
              "stable_acceptance_fields": stable_values,
              "memcheck_clean_summary_source": memcheck_source.name if memcheck_source else None,
              "racecheck_clean_summary_source": racecheck_source.name if racecheck_source else None,
              "dual_location_sanitizer_archive_observed": bool(
                  memcheck_source and racecheck_source
                  and (memcheck_source.name.endswith("-run.json") or racecheck_source.name.endswith("-run.json"))
              ),
              "geometry_receipt_authority": False,
              "universal_speedup_claim": False,
              "issues": issues,
          }
          (root / "V1_VALIDATION.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          if issues:
              raise SystemExit("; ".join(issues))
          PY
          (cd "$campaign" && sha256sum -c SHA256SUMS.txt)
          touch "$EVIDENCE_ROOT/V1_VALIDATION.ok"

      - name: V2 V3 V3.1 exact comparison atomic
        env:
          U: ${{ inputs.u_segments }}
          V: ${{ inputs.v_segments }}
          REPEATS: "1"
          DEVICES: "0"
          BLOCK_SIZE: "256"
          WARMUP: ${{ inputs.warmup_iterations }}
          ITERATIONS: ${{ inputs.measured_iterations }}
          CUDA_GRAPHS: "off"
          REDUCTION: "atomic"
          GLUBALL_CUDA_ARCHITECTURES: native
          BUILD_DIR: ${{ github.workspace }}/build/cuda-v31-ab
          OUTPUT_DIR: ${{ github.workspace }}/physical-evidence/runtime-v31-efficiency/ab-atomic
        run: sh scripts/compare_cuda_runtime_v2_v3_v31.sh

      - name: V2 V3 V3.1 exact comparison two-stage
        env:
          U: ${{ inputs.u_segments }}
          V: ${{ inputs.v_segments }}
          REPEATS: "1"
          DEVICES: "0"
          BLOCK_SIZE: "256"
          WARMUP: ${{ inputs.warmup_iterations }}
          ITERATIONS: ${{ inputs.measured_iterations }}
          CUDA_GRAPHS: "off"
          REDUCTION: "two-stage"
          GLUBALL_CUDA_ARCHITECTURES: native
          BUILD_DIR: ${{ github.workspace }}/build/cuda-v31-ab
          OUTPUT_DIR: ${{ github.workspace }}/physical-evidence/runtime-v31-efficiency/ab-two-stage
        run: sh scripts/compare_cuda_runtime_v2_v3_v31.sh

      - name: Runtime V3.1 bounded exhaustive tuner
        env:
          U: ${{ inputs.u_segments }}
          V: ${{ inputs.v_segments }}
          REPEATS: "1"
          DEVICES: "0"
          WARMUP: ${{ inputs.warmup_iterations }}
          ITERATIONS: ${{ inputs.measured_iterations }}
          TRIALS: ${{ inputs.trials }}
          BLOCK_SIZES: "32,64,128,256,512,1024"
          GRAPH_MODES: "off,on"
          REDUCTION_MODES: "atomic,two-stage"
          GLUBALL_CUDA_ARCHITECTURES: native
          BUILD_DIR: ${{ github.workspace }}/build/cuda-v31-tune
          OUTPUT_DIR: ${{ github.workspace }}/physical-evidence/runtime-v31-efficiency/tuning
        run: sh scripts/tune_cuda_runtime_v31.sh

      - name: Compute Sanitizer Runtime V3.1 both reduction modes
        run: |
          set -eu
          root="$EVIDENCE_ROOT/v31-sanitizer"
          mkdir -p "$root"
          binary="$GITHUB_WORKSPACE/build/cuda-v31-tune/gluball-cuda-runtime-v31"
          test -x "$binary"

          set +e
          compute-sanitizer --tool memcheck --error-exitcode 86 \
            "$binary" --mode throughput --u 512 --v 32 --repeats 1 --devices 0 \
            --block-size 256 --warmup 1 --iterations 2 --cuda-graphs off --reduction atomic --repeat-run 0 \
            > "$root/memcheck-atomic.txt" 2>&1
          memcheck_atomic_status=$?
          compute-sanitizer --tool racecheck --error-exitcode 87 \
            "$binary" --mode throughput --u 512 --v 32 --repeats 1 --devices 0 \
            --block-size 256 --warmup 1 --iterations 2 --cuda-graphs off --reduction atomic --repeat-run 0 \
            > "$root/racecheck-atomic.txt" 2>&1
          racecheck_atomic_status=$?
          compute-sanitizer --tool memcheck --error-exitcode 86 \
            "$binary" --mode throughput --u 512 --v 32 --repeats 1 --devices 0 \
            --block-size 256 --warmup 1 --iterations 2 --cuda-graphs off --reduction two-stage --repeat-run 0 \
            > "$root/memcheck-two-stage.txt" 2>&1
          memcheck_two_stage_status=$?
          compute-sanitizer --tool racecheck --error-exitcode 87 \
            "$binary" --mode throughput --u 512 --v 32 --repeats 1 --devices 0 \
            --block-size 256 --warmup 1 --iterations 2 --cuda-graphs off --reduction two-stage --repeat-run 0 \
            > "$root/racecheck-two-stage.txt" 2>&1
          racecheck_two_stage_status=$?
          set -e

          printf '%s\n' \
            "memcheck_atomic=$memcheck_atomic_status" \
            "racecheck_atomic=$racecheck_atomic_status" \
            "memcheck_two_stage=$memcheck_two_stage_status" \
            "racecheck_two_stage=$racecheck_two_stage_status" \
            > "$root/SANITIZER_EXIT_STATUS.txt"

          failed=0
          for status in "$memcheck_atomic_status" "$racecheck_atomic_status" "$memcheck_two_stage_status" "$racecheck_two_stage_status"; do
            [ "$status" -eq 0 ] || failed=1
          done
          grep -Fq 'ERROR SUMMARY: 0 errors' "$root/memcheck-atomic.txt" || failed=1
          grep -Fq 'RACECHECK SUMMARY: 0 hazards displayed (0 errors, 0 warnings)' "$root/racecheck-atomic.txt" || failed=1
          grep -Fq 'ERROR SUMMARY: 0 errors' "$root/memcheck-two-stage.txt" || failed=1
          grep -Fq 'RACECHECK SUMMARY: 0 hazards displayed (0 errors, 0 warnings)' "$root/racecheck-two-stage.txt" || failed=1
          if [ "$failed" -ne 0 ]; then
            cat "$root/SANITIZER_EXIT_STATUS.txt" >&2
            exit 88
          fi
          touch "$EVIDENCE_ROOT/V31_SANITIZER.ok"

      - name: Finalize Runtime V3.1 efficiency bundle
        if: always()
        run: |
          set -eu
          root="$EVIDENCE_ROOT"
          mkdir -p "$root"
          python3 - "$root" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          ordered_required = [
              ("host_validation", root / "HOST_VALIDATION.ok"),
              ("v1_validation", root / "V1_VALIDATION.ok"),
              ("atomic_equivalence", root / "ab-atomic" / "EQUIVALENCE.json"),
              ("two_stage_equivalence", root / "ab-two-stage" / "EQUIVALENCE.json"),
              ("tuning", root / "tuning" / "TUNING_RESULT.json"),
              ("v31_sanitizer", root / "V31_SANITIZER.ok"),
          ]
          observed = {key: path.exists() for key, path in ordered_required}
          status = "PASS" if all(observed.values()) else "FAIL"
          completed = [key for key, present in observed.items() if present]
          first_incomplete = next((key for key, present in observed.items() if not present), None)

          v1_summary_path = root / "v1-acceptance" / "V1_VALIDATION.json"
          v1_summary = None
          if v1_summary_path.exists():
              try:
                  v1_summary = json.loads(v1_summary_path.read_text())
              except Exception:
                  v1_summary = {"status": "UNREADABLE"}

          excluded_finalizer_files = {"VALIDATION_STATUS.json", "BUNDLE_SHA256SUMS.txt"}
          retained_evidence_files = sorted(
              str(path.relative_to(root))
              for path in root.rglob("*")
              if path.is_file() and path.name not in excluded_finalizer_files
          )
          evidence_retained = bool(retained_evidence_files)

          payload = {
              "schema": "gluball-runtime-v31-physical-efficiency-status/1",
              "status": status,
              "required_markers": observed,
              "completed_required_stages": completed,
              "first_incomplete_required_stage": first_incomplete,
              "evidence_retained": evidence_retained,
              "partial_evidence_retained": status != "PASS" and evidence_retained,
              "retained_evidence_file_count": len(retained_evidence_files),
              "v1_validation_summary_present": v1_summary_path.exists(),
              "v1_validation_summary_status": v1_summary.get("status") if isinstance(v1_summary, dict) else None,
              "v1_output_repeatable_byte_identical": v1_summary.get("output_repeatable_byte_identical") if isinstance(v1_summary, dict) else None,
              "v1_acceptance_record_count": v1_summary.get("acceptance_record_count") if isinstance(v1_summary, dict) else None,
              "performance_observation_only": True,
              "reference_residual_checked": False,
              "conformance_acceptance": False,
              "geometry_receipt_authority": False,
              "universal_speedup_claim": False,
              "raw_device_uuid_published": False,
              "full_point_cache_enabled": False,
              "cached_complete_observation_enabled": False,
          }
          (root / "VALIDATION_STATUS.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
          (cd "$root" && find . -type f ! -name BUNDLE_SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > BUNDLE_SHA256SUMS.txt)

      - name: Upload Runtime V3.1 efficiency evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gluball-runtime-v31-efficiency-${{ github.run_id }}-${{ github.run_attempt }}
          path: physical-evidence/runtime-v31-efficiency
          if-no-files-found: error
          retention-days: 90

      - name: Require final PASS
        if: always()
        run: |
          set -eu
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("physical-evidence/runtime-v31-efficiency/VALIDATION_STATUS.json").read_text())
          if payload.get("status") != "PASS": raise SystemExit("Runtime V3.1 physical efficiency campaign did not reach PASS")
          PY
