name: GLUBALL physical CUDA 1-2-4 ladder

on:
  workflow_dispatch:
    inputs:
      u_segments:
        description: "U segments for each evidence campaign"
        required: true
        default: "16384"
        type: string
      v_segments:
        description: "V segments for each evidence campaign"
        required: true
        default: "128"
        type: string
      repeats:
        description: "Full mesh repeats inside each CUDA run"
        required: true
        default: "1"
        type: string
      accepted_runs:
        description: "Required evidence runs per device count"
        required: true
        default: "3"
        type: string
      cuda_architecture:
        description: "CMake CUDA architecture (89 for RTX 4080 SUPER)"
        required: true
        default: "89"
        type: string

permissions:
  contents: read

concurrency:
  group: gluball-physical-cuda-ladder
  cancel-in-progress: false

jobs:
  physical-cuda-ladder:
    name: Same-host 1 -> 2 -> 4 GPU evidence
    runs-on: [self-hosted, linux, x64, gluball-vast-8gpu]
    timeout-minutes: 120

    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Expose rented-host toolchains
        run: |
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          printf '%s\n' '/usr/local/cuda/bin' >> "$GITHUB_PATH"

      - name: Record exact source and redacted host inventory
        run: |
          set -eu
          mkdir -p physical-evidence
          git rev-parse HEAD | tee physical-evidence/SOURCE_COMMIT.txt
          uname -a | tee physical-evidence/HOST_UNAME.txt
          nvidia-smi --query-gpu=index,name --format=csv,noheader \
            | tee physical-evidence/NVIDIA_DEVICES.txt
          nvidia-smi --query-gpu=index,name,driver_version,compute_cap,memory.total --format=csv \
            | tee physical-evidence/NVIDIA_INVENTORY.csv
          test "$(nvidia-smi --query-gpu=index --format=csv,noheader | wc -l)" -ge 4

      - name: GLUBALL CUDA preflight
        run: sh scripts/cuda_preflight.sh | tee physical-evidence/PREFLIGHT.txt

      - name: 1 GPU evidence - three accepted runs
        env:
          MODE: evidence
          U: ${{ inputs.u_segments }}
          V: ${{ inputs.v_segments }}
          REPEATS: ${{ inputs.repeats }}
          RUNS: ${{ inputs.accepted_runs }}
          DEVICES: "0"
          RUST_WORKERS: "32"
          LOGICAL_DEVICE_SLOTS: "1"
          GLUBALL_CUDA_ARCHITECTURES: ${{ inputs.cuda_architecture }}
          CAMPAIGN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-1gpu
          ARTIFACT_DIR: ${{ github.workspace }}/physical-evidence/1gpu
        run: sh scripts/run_vast_campaign.sh

      - name: 2 GPU evidence - three accepted runs
        env:
          MODE: evidence
          U: ${{ inputs.u_segments }}
          V: ${{ inputs.v_segments }}
          REPEATS: ${{ inputs.repeats }}
          RUNS: ${{ inputs.accepted_runs }}
          DEVICES: "0,1"
          RUST_WORKERS: "32"
          LOGICAL_DEVICE_SLOTS: "2"
          GLUBALL_CUDA_ARCHITECTURES: ${{ inputs.cuda_architecture }}
          CAMPAIGN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-2gpu
          ARTIFACT_DIR: ${{ github.workspace }}/physical-evidence/2gpu
        run: sh scripts/run_vast_campaign.sh

      - name: 4 GPU evidence - three accepted runs
        env:
          MODE: evidence
          U: ${{ inputs.u_segments }}
          V: ${{ inputs.v_segments }}
          REPEATS: ${{ inputs.repeats }}
          RUNS: ${{ inputs.accepted_runs }}
          DEVICES: "0,1,2,3"
          RUST_WORKERS: "32"
          LOGICAL_DEVICE_SLOTS: "4"
          GLUBALL_CUDA_ARCHITECTURES: ${{ inputs.cuda_architecture }}
          CAMPAIGN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-4gpu
          ARTIFACT_DIR: ${{ github.workspace }}/physical-evidence/4gpu
        run: sh scripts/run_vast_campaign.sh

      - name: Summarize accepted residuals
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import json

          print("## GLUBALL physical CUDA evidence ladder")
          print()
          print("| Device set | Run | Status | Checked points | Max component residual | Max Euclidean residual |")
          print("| --- | ---: | --- | ---: | ---: | ---: |")
          for label in ("1gpu", "2gpu", "4gpu"):
              paths = sorted(glob.glob(f"physical-evidence/{label}/cuda-acceptance-*.json"))
              if not paths:
                  print(f"| {label} | - | no acceptance artifact | - | - | - |")
                  continue
              for path in paths:
                  with open(path, "r", encoding="utf-8") as handle:
                      record = json.load(handle)
                  run = record.get("repeat_run", "?")
                  status = record.get("status", "?")
                  checked = record.get("checked_points", "?")
                  component = record.get("max_component_residual", "?")
                  euclidean = record.get("max_euclidean_residual", "?")
                  print(f"| {label} | {run} | {status} | {checked} | {component} | {euclidean} |")
          print()
          print("Correctness evidence only. Timing observations do not imply universal speedup or geometry authority.")
          PY

      - name: Upload physical evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gluball-physical-cuda-1-2-4-${{ github.run_id }}-${{ github.run_attempt }}
          path: physical-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
