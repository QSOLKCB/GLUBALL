name: GLUBALL Phase 5C multi-GPU core

on:
  workflow_call:
    inputs:
      runner_label:
        required: true
        type: string
      expected_model_fragment:
        required: true
        type: string
      required_devices:
        required: true
        type: number
      scaling_counts:
        required: true
        type: string
      artifact_slug:
        required: true
        type: string
      v1_u_segments:
        required: true
        type: number
      v1_v_segments:
        required: true
        type: number
      v1_accepted_runs:
        required: true
        type: number
      strong_u_segments:
        required: true
        type: number
      strong_v_segments:
        required: true
        type: number
      weak_u_per_device:
        required: true
        type: number
      warmup_iterations:
        required: true
        type: number
      measured_iterations:
        required: true
        type: number
      block_size:
        required: true
        type: number

permissions:
  contents: read

jobs:
  phase5c-multigpu:
    name: Phase 5C ${{ inputs.artifact_slug }} physical scaling
    runs-on: [self-hosted, linux, x64, "${{ inputs.runner_label }}"]
    timeout-minutes: 120
    env:
      EVIDENCE_ROOT: physical-evidence/${{ inputs.artifact_slug }}

    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Expose rented-host toolchains
        run: |
          set -eu
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          printf '%s\n' '/usr/local/cuda/bin' >> "$GITHUB_PATH"

      - name: Validate campaign inputs
        env:
          REQUIRED_DEVICES: ${{ inputs.required_devices }}
          SCALING_COUNTS: ${{ inputs.scaling_counts }}
          ARTIFACT_SLUG: ${{ inputs.artifact_slug }}
          V1_U: ${{ inputs.v1_u_segments }}
          V1_V: ${{ inputs.v1_v_segments }}
          V1_RUNS: ${{ inputs.v1_accepted_runs }}
          STRONG_U: ${{ inputs.strong_u_segments }}
          STRONG_V: ${{ inputs.strong_v_segments }}
          WEAK_U_PER_DEVICE: ${{ inputs.weak_u_per_device }}
          WARMUP: ${{ inputs.warmup_iterations }}
          ITERATIONS: ${{ inputs.measured_iterations }}
          BLOCK_SIZE: ${{ inputs.block_size }}
          MODEL_FRAGMENT: ${{ inputs.expected_model_fragment }}
        run: |
          python3 - <<'PY'
          import os
          import re

          def integer(name, minimum, maximum):
              raw = os.environ[name]
              if not raw.isdecimal():
                  raise SystemExit(f"{name} must be a decimal integer, got {raw!r}")
              value = int(raw, 10)
              if not minimum <= value <= maximum:
                  raise SystemExit(f"{name} must be in [{minimum}, {maximum}], got {value}")
              return value

          required = integer("REQUIRED_DEVICES", 8, 16)
          v1_u = integer("V1_U", 12, 1_000_000)
          v1_v = integer("V1_V", 6, 65_536)
          integer("V1_RUNS", 3, 100)
          integer("STRONG_U", 12, 1_000_000)
          integer("STRONG_V", 6, 65_536)
          weak_u = integer("WEAK_U_PER_DEVICE", 12, 1_000_000)
          integer("WARMUP", 0, 1_000)
          integer("ITERATIONS", 2, 10_000)
          block = integer("BLOCK_SIZE", 32, 1_024)
          if block & (block - 1):
              raise SystemExit("BLOCK_SIZE must be a power of two")

          v1_points = v1_u * v1_v
          if v1_points > 16_777_216:
              raise SystemExit(f"V1 full-readback workload exceeds 16,777,216 points: {v1_points}")
          if weak_u * required > 1_000_000:
              raise SystemExit("WEAK_U_PER_DEVICE * REQUIRED_DEVICES exceeds Runtime V2 U limit")

          raw_counts = os.environ["SCALING_COUNTS"]
          if not re.fullmatch(r"[0-9]+(?:,[0-9]+)*", raw_counts):
              raise SystemExit("SCALING_COUNTS must be comma-separated positive integers")
          counts = [int(value) for value in raw_counts.split(",")]
          if counts != sorted(set(counts)):
              raise SystemExit("SCALING_COUNTS must be unique and strictly increasing")
          if counts[0] != 1 or counts[-1] != required:
              raise SystemExit("SCALING_COUNTS must start at 1 and end at REQUIRED_DEVICES")
          if any(value < 1 or value > required for value in counts):
              raise SystemExit("SCALING_COUNTS contains an out-of-range device count")
          for baseline in (1, 2, 4, 8):
              if baseline not in counts:
                  raise SystemExit(f"SCALING_COUNTS must contain primary baseline {baseline}")

          slug = os.environ["ARTIFACT_SLUG"]
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]*", slug):
              raise SystemExit("ARTIFACT_SLUG must contain lowercase letters, digits, and hyphens only")
          if not os.environ["MODEL_FRAGMENT"].strip():
              raise SystemExit("MODEL_FRAGMENT must not be empty")
          PY

      - name: Record and validate physical host provenance
        env:
          REQUIRED_DEVICES: ${{ inputs.required_devices }}
          MODEL_FRAGMENT: ${{ inputs.expected_model_fragment }}
        run: |
          set -eu
          root="$EVIDENCE_ROOT"
          mkdir -p "$root"

          git rev-parse HEAD | tee "$root/SOURCE_COMMIT.txt"
          uname -a | tee "$root/HOST_UNAME.txt"
          uname -m | tee "$root/HOST_ARCH.txt"
          cat /etc/os-release > "$root/OS_RELEASE.txt"
          test "$(uname -m)" = x86_64

          nvidia-smi --query-gpu=index,name --format=csv,noheader \
            | tee "$root/NVIDIA_DEVICES.txt"
          nvidia-smi --query-gpu=index,name,driver_version,compute_cap,memory.total --format=csv \
            | tee "$root/NVIDIA_INVENTORY.csv"

          gpu_count=$(nvidia-smi --query-gpu=index --format=csv,noheader | wc -l)
          if [ "$gpu_count" -lt "$REQUIRED_DEVICES" ]; then
            printf 'campaign requires at least %s visible GPUs; found %s\n' "$REQUIRED_DEVICES" "$gpu_count" >&2
            exit 2
          fi

          first_models=$(nvidia-smi --query-gpu=name --format=csv,noheader | sed -n "1,${REQUIRED_DEVICES}p")
          first_caps=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | sed -n "1,${REQUIRED_DEVICES}p")
          distinct_models=$(printf '%s\n' "$first_models" | LC_ALL=C sort -u | wc -l)
          distinct_caps=$(printf '%s\n' "$first_caps" | LC_ALL=C sort -u | wc -l)
          test "$distinct_models" -eq 1
          test "$distinct_caps" -eq 1
          if printf '%s\n' "$first_models" | grep -Fv "$MODEL_FRAGMENT" >/dev/null; then
            printf 'one or more selected GPUs do not match expected model fragment %s\n' "$MODEL_FRAGMENT" >&2
            printf '%s\n' "$first_models" >&2
            exit 2
          fi

          model=$(printf '%s\n' "$first_models" | sed -n '1p')
          capability=$(printf '%s\n' "$first_caps" | sed -n '1p')
          arch_digits=$(printf '%s' "$capability" | tr -d '.')
          expected_sm="sm_${arch_digits}"
          expected_compute="compute_${arch_digits}"
          printf '%s\n' "$model" > "$root/SELECTED_GPU_MODEL.txt"
          printf '%s\n' "$capability" > "$root/EXPECTED_COMPUTE_CAPABILITY.txt"
          printf '%s\n' "$expected_sm" > "$root/EXPECTED_SM.txt"
          python3 - "$REQUIRED_DEVICES" > "$root/SELECTED_DEVICES.txt" <<'PY'
          import sys
          print(",".join(str(index) for index in range(int(sys.argv[1]))))
          PY

          command -v nvcc
          nvcc --version | tee "$root/NVCC.txt"
          nvcc --list-gpu-arch | tee "$root/NVCC_GPU_ARCHS.txt"
          nvcc --list-gpu-code | tee "$root/NVCC_GPU_CODE.txt"
          grep -Fxq "$expected_compute" "$root/NVCC_GPU_ARCHS.txt"
          grep -Fxq "$expected_sm" "$root/NVCC_GPU_CODE.txt"

          rustc --version | tee "$root/RUSTC.txt"
          cargo --version | tee "$root/CARGO.txt"
          cmake --version | tee "$root/CMAKE.txt"
          compute-sanitizer --version | tee "$root/COMPUTE_SANITIZER.txt"
          touch "$root/HOST_VALIDATION.ok"

      - name: V1 eight-device bounded correctness acceptance
        env:
          MODE: evidence
          U: ${{ inputs.v1_u_segments }}
          V: ${{ inputs.v1_v_segments }}
          REPEATS: "1"
          RUNS: ${{ inputs.v1_accepted_runs }}
          DEVICES: "0,1,2,3,4,5,6,7"
          RUST_WORKERS: "32"
          LOGICAL_DEVICE_SLOTS: "8"
          GLUBALL_CUDA_ARCHITECTURES: native
          CAMPAIGN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.artifact_slug }}-v1
          ARTIFACT_DIR: ${{ github.workspace }}/physical-evidence/${{ inputs.artifact_slug }}/v1-acceptance
        run: sh scripts/run_vast_campaign.sh

      - name: Verify V1 acceptance and sanitizer archival boundary
        env:
          EXPECTED_RUNS: ${{ inputs.v1_accepted_runs }}
          EXPECTED_U: ${{ inputs.v1_u_segments }}
          EXPECTED_V: ${{ inputs.v1_v_segments }}
        run: |
          set -eu
          root="$EVIDENCE_ROOT"
          campaign="$root/v1-acceptance"

          python3 - <<'PY'
          import glob
          import json
          import os

          expected_runs = int(os.environ["EXPECTED_RUNS"])
          expected_u = int(os.environ["EXPECTED_U"])
          expected_v = int(os.environ["EXPECTED_V"])
          expected_points = expected_u * expected_v
          paths = sorted(glob.glob(os.path.join(os.environ["EVIDENCE_ROOT"], "v1-acceptance", "cuda-acceptance-*.json")))
          if len(paths) != expected_runs:
              raise SystemExit(f"expected {expected_runs} V1 acceptance records, found {len(paths)}")
          summaries = []
          fingerprints = set()
          for path in paths:
              with open(path, "r", encoding="utf-8") as handle:
                  record = json.load(handle)
              required = {
                  "status": "PASS",
                  "u_segments": expected_u,
                  "v_segments": expected_v,
                  "repeats": 1,
                  "total_points": expected_points,
                  "checked_points": expected_points,
                  "complete_output_readback": True,
                  "sidecar_claims_checked": True,
                  "reference_residual_checked": True,
                  "nonfinite_records": 0,
                  "conformance_acceptance": True,
                  "geometry_receipt_authority": False,
                  "universal_speedup_claim": False,
              }
              for key, expected in required.items():
                  if record.get(key) != expected:
                      raise SystemExit(f"{path}: {key}={record.get(key)!r}, expected {expected!r}")
              fingerprints.add(record["evidence_artifact_fnv1a64"])
              summaries.append({
                  "repeat_run": record["repeat_run"],
                  "checked_points": record["checked_points"],
                  "max_component_residual": record["max_component_residual"],
                  "max_euclidean_residual": record["max_euclidean_residual"],
                  "max_reported_tube_radius_error": record["max_reported_tube_radius_error"],
                  "evidence_artifact_fnv1a64": record["evidence_artifact_fnv1a64"],
              })
          if len(fingerprints) != 1:
              raise SystemExit("V1 evidence fingerprints differ across accepted repeats")
          summary = {
              "schema": "gluball-phase5c-v1-validation/1",
              "accepted_runs": expected_runs,
              "selected_device_count": 8,
              "points_checked_per_run": expected_points,
              "total_points_checked": expected_runs * expected_points,
              "all_acceptance_records_passed": True,
              "complete_output_readback": True,
              "independent_rust_residual_acceptance": True,
              "geometry_receipt_authority": False,
              "universal_speedup_claim": False,
              "runs": summaries,
          }
          output = os.path.join(os.environ["EVIDENCE_ROOT"], "V1_VALIDATION.json")
          with open(output, "w", encoding="utf-8") as handle:
              json.dump(summary, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

          find_clean_summary() {
            expected=$1
            shift
            for candidate in "$@"; do
              if [ -s "$candidate" ] && grep -Fq "$expected" "$candidate"; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 1
          }

          memcheck_source=$(find_clean_summary \
            'ERROR SUMMARY: 0 errors' \
            "$campaign/memcheck.txt" "$campaign/memcheck-run.json")
          racecheck_source=$(find_clean_summary \
            'RACECHECK SUMMARY: 0 hazards displayed (0 errors, 0 warnings)' \
            "$campaign/racecheck.txt" "$campaign/racecheck-run.json")
          printf 'clean memcheck archived in %s; clean racecheck archived in %s\n' \
            "$(basename "$memcheck_source")" "$(basename "$racecheck_source")" \
            > "$root/V1_SANITIZER_STATUS.txt"

          (
            cd "$campaign"
            sha256sum -c SHA256SUMS.txt
          )
          touch "$root/V1_VALIDATION.ok"

      - name: Runtime V2 strong weak and full-host graph campaign
        env:
          ROOT: ${{ github.workspace }}/physical-evidence/${{ inputs.artifact_slug }}
          EXPECTED_MODEL_FRAGMENT: ${{ inputs.expected_model_fragment }}
          REQUIRED_DEVICES: ${{ inputs.required_devices }}
          SCALING_COUNTS: ${{ inputs.scaling_counts }}
          STRONG_U: ${{ inputs.strong_u_segments }}
          STRONG_V: ${{ inputs.strong_v_segments }}
          WEAK_U_PER_DEVICE: ${{ inputs.weak_u_per_device }}
          WARMUP: ${{ inputs.warmup_iterations }}
          ITERATIONS: ${{ inputs.measured_iterations }}
          BLOCK_SIZE: ${{ inputs.block_size }}
          BUILD_DIR: build/cuda-v2-phase5c
        run: |
          sh scripts/run_phase5c_multigpu_scaling.sh
          touch "$EVIDENCE_ROOT/V2_SCALING.ok"

      - name: Compute Sanitizer Runtime V2 compact kernel
        run: |
          set -eu
          root="$EVIDENCE_ROOT"
          mkdir -p "$root/runtime-v2-sanitizer"
          binary=build/cuda-v2-phase5c/gluball-cuda-runtime-v2
          test -x "$binary"

          compute-sanitizer --tool memcheck --error-exitcode 86 \
            "$binary" --mode throughput --u 512 --v 32 --repeats 1 \
            --devices 0 --block-size 256 --warmup 0 --iterations 1 \
            --cuda-graphs off --repeat-run 901 \
            > "$root/runtime-v2-sanitizer/memcheck.txt" 2>&1
          grep -Fq 'ERROR SUMMARY: 0 errors' "$root/runtime-v2-sanitizer/memcheck.txt"

          compute-sanitizer --tool racecheck --error-exitcode 87 \
            "$binary" --mode throughput --u 512 --v 32 --repeats 1 \
            --devices 0 --block-size 256 --warmup 0 --iterations 1 \
            --cuda-graphs off --repeat-run 902 \
            > "$root/runtime-v2-sanitizer/racecheck.txt" 2>&1
          grep -Fq 'RACECHECK SUMMARY: 0 hazards displayed (0 errors, 0 warnings)' \
            "$root/runtime-v2-sanitizer/racecheck.txt"
          printf '%s\n' 'Runtime V2 bounded memcheck and racecheck clean.' > "$root/V2_SANITIZER_STATUS.txt"
          touch "$root/V2_SANITIZER.ok"

      - name: Finalize Phase 5C physical bundle
        if: always()
        run: |
          set -eu
          root="$EVIDENCE_ROOT"
          mkdir -p "$root"
          status=PASS
          for marker in HOST_VALIDATION.ok V1_VALIDATION.ok V2_SCALING.ok V2_SANITIZER.ok; do
            if [ ! -f "$root/$marker" ]; then
              status=INCOMPLETE
            fi
          done

          python3 - "$status" <<'PY'
          import json
          import os
          import sys
          record = {
              "schema": "gluball-phase5c-multigpu-status/1",
              "status": sys.argv[1],
              "v1_correctness_evidence_uses_first_eight_devices": True,
              "runtime_v2_scaling_observation_required": True,
              "runtime_v2_sanitizer_required": True,
              "performance_observation_only": True,
              "geometry_receipt_authority": False,
              "universal_speedup_claim": False,
          }
          with open(os.path.join(os.environ["EVIDENCE_ROOT"], "VALIDATION_STATUS.json"), "w", encoding="utf-8") as handle:
              json.dump(record, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

          (
            cd "$root"
            find . -type f ! -path './SHA256SUMS.txt' -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 -r sha256sum \
              > SHA256SUMS.txt
          )
          test -s "$root/SHA256SUMS.txt"
          (
            cd physical-evidence
            find . -type f ! -name BUNDLE_SHA256SUMS.txt -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 -r sha256sum \
              > BUNDLE_SHA256SUMS.txt
          )
          test -s physical-evidence/BUNDLE_SHA256SUMS.txt

          if [ "$status" != PASS ]; then
            printf '%s\n' 'Phase 5C physical campaign did not satisfy every required gate.' >&2
            exit 2
          fi

      - name: Summarize Phase 5C scaling
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_ROOT"])
          print(f"## GLUBALL Phase 5C {root.name} physical scaling")
          print()
          status_path = root / "VALIDATION_STATUS.json"
          if status_path.exists():
              print(f"**Bundle status:** {json.loads(status_path.read_text()).get('status', '?')}")
          for title, filename in (("Strong scaling", "STRONG_SCALING.json"), ("Weak scaling", "WEAK_SCALING.json")):
              path = root / filename
              if not path.exists():
                  continue
              record = json.loads(path.read_text())
              print()
              print(f"### {title}")
              print("| GPUs | Median wall ms | Model points/s | Observation |")
              print("| ---: | ---: | ---: | ---: |")
              for item in record["measurements"]:
                  observation = item.get("observed_speedup_vs_1gpu", item.get("observed_time_ratio_vs_1gpu"))
                  print(f"| {item['device_count']} | {item['iteration_wall_milliseconds_median']} | {item['model_points_per_second_median']} | {observation} |")
          graph_path = root / "FULL_HOST_GRAPH_COMPARISON.json"
          if graph_path.exists():
              graph = json.loads(graph_path.read_text())
              print()
              print(f"Full-host observed graph wall ratio: `{graph['observed_graph_wall_speedup']}`")
          print()
          print("V1 is correctness evidence. Runtime V2 scaling is performance observation only. GPU output is not geometry authority and no universal speedup claim is made.")
          PY

      - name: Upload Phase 5C physical evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gluball-phase5c-${{ inputs.artifact_slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: physical-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
